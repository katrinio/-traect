services:
  traect:
    image: ghcr.io/katrinio/traect:latest
    build:
      context: .
      target: production
      args:
        TRAECT_VERSION: ${TRAECT_VERSION:?TRAECT_VERSION must be set to a commit SHA, git tag, or build id}
    container_name: traect

    labels:
      com.katrin.logs.app: "traect"
      com.katrin.logs.environment: "production"

    restart: unless-stopped
    ports:
      - "127.0.0.1:8012:8000"
    environment:
      TRAECT_HOST: 0.0.0.0
      TRAECT_PORT: 8000
      TRAECT_ENV: production
      TRAECT_VERSION: ${TRAECT_VERSION:?TRAECT_VERSION must be set to a commit SHA, git tag, or build id}
      TRAECT_DATABASE_URL: sqlite:////data/traect.db
      TRAECT_TIMEZONE: Europe/Belgrade
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
